name: IndexNow submit

# After a production deploy, tell Bing/Yandex (via IndexNow) which URLs changed. Rulebook 11.2: submit added, changed and
# removed URLs, never the whole sitemap again. Per-quiz publishes already ping from the app (lib/seo/quiz-freshness.ts).
#
# How: the last sitemap is kept as the artifact "sitemap-snapshot" of the last successful run. This run fetches the live sitemap,
# POSTs the previous one to /api/indexnow, which compares it with the live sitemap and submits only what was added, removed or got
# a different lastmod (src/lib/indexnow-diff.ts). With no previous snapshot (first run) it submits 0 and records the baseline, so an
# unchanged push submits 0. Only main triggers it (the seo-indexation branch trigger is gone).
#
# Two jobs, one per domain. `submit` is kpopquiz.org. `submit-hub` is bunnyverse.org, the hub and /anime (SEO-LAUNCH-1, lane C): its /sitemap.xml is a
# sitemap index, so the snapshot is the flattened urlset of /sitemap-hub.xml and /anime/sitemap.xml (the children the index lists), never the index itself.
# The route of the hub build compares that snapshot with the same two children, and its key (the hub key, at the root of bunnyverse.org) covers the /anime URLs too.
#
# SETUP (one time):
#   1. Vercel: set env INDEXNOW_TRIGGER_TOKEN to a secret string (redeploy). Set it on the kpopquiz project AND on the bunnyverse.org (fandomverse) project,
#      with the SAME value (the hub job answers 401 without it).
#   2. GitHub: repo Settings > Secrets and variables > Actions > New secret
#      INDEXNOW_TOKEN with the SAME value.
# workflow_dispatch lets you run it manually from the Actions tab to test.
#
# Independence (SEO-LAUNCH-1 review, fix 5): each job finds its own previous snapshot, the newest unexpired artifact of its own name
# (sitemap-snapshot, sitemap-snapshot-hub), not "the last successful run of the workflow". The hub job is continue-on-error, a failed fetch or an HTTP
# error of the route records the baseline instead of failing, and nothing the hub job does can make the kpop job diff against an older snapshot.
#
# hub_urls (workflow_dispatch only): newline-separated URLs or paths of bunnyverse.org. When given, only the hub job runs, and it POSTs exactly those URLs once
# through the hub route (mode=urls, same token), never the sitemap. It is for the new URLs of a first deploy (docs/seo/strategy-2026-11-23/POST-DEPLOY-INDEXNOW.md).
# The route sends nothing while the hub is closed to search engines (NET_INDEXING). The run still records the live sitemap, so the next push does not send them again.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hub_urls:
        description: 'bunnyverse.org URLs or paths to submit once, one per line (leave empty for the normal diff run)'
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

jobs:
  submit:
    name: submit (kpopquiz.org)
    # A run with a hub_urls list is a hub-only run.
    if: ${{ github.event.inputs.hub_urls == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Vercel deploy to go live
        run: sleep 120
      - name: Fetch the live sitemap
        run: |
          mkdir -p current prev
          curl -fsS https://kpopquiz.org/sitemap.xml -o current/sitemap.xml
      - name: Fetch the sitemap of the last submission
        # The job has no checkout, so gh cannot read the repository from a .git folder: GH_REPO names it (without it every run
        # since #220 stopped here with "failed to determine base repo: ... not a git repository").
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The newest unexpired artifact of this job's own name, whatever the conclusion of the run that made it.
          id=$(gh api "repos/${GH_REPO}/actions/artifacts?name=sitemap-snapshot&per_page=1" --jq '.artifacts[0] | select(.expired == false) | .workflow_run.id // empty' || true)
          if [ -n "$id" ]; then gh run download "$id" --name sitemap-snapshot --dir prev || echo "no snapshot in run $id"; fi
      - name: Submit the changed URLs to IndexNow
        env:
          INDEXNOW_TOKEN: ${{ secrets.INDEXNOW_TOKEN }}
        run: |
          if [ -z "$INDEXNOW_TOKEN" ]; then
            echo "INDEXNOW_TOKEN secret not set - skipping"; exit 0
          fi
          if [ -s prev/sitemap.xml ]; then
            curl -fsS -X POST -H 'content-type: application/xml' --data-binary @prev/sitemap.xml "https://kpopquiz.org/api/indexnow?token=${INDEXNOW_TOKEN}"
          else
            echo "no previous sitemap: recording the baseline, submitting nothing"
            curl -fsS -X POST --data-binary '' "https://kpopquiz.org/api/indexnow?token=${INDEXNOW_TOKEN}"
          fi
      - name: Keep this sitemap for the next run
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-snapshot
          path: current/sitemap.xml
          retention-days: 90

  submit-hub:
    name: submit (bunnyverse.org, hub and /anime)
    # Independent of the kpopquiz.org job: its failure never fails the run, and it never decides what the other job compares with.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Vercel deploy to go live
        run: sleep 120
      - name: Fetch the live sitemaps of the hub and of OtakuQuiz, flattened into one urlset
        id: fetch
        run: |
          mkdir -p current prev
          # A failed fetch of the hub sitemap is not an error of the run: nothing is recorded or submitted, and the previous snapshot stays the newest one.
          if ! curl -fsS https://bunnyverse.org/sitemap-hub.xml -o hub.xml; then
            echo "the hub sitemap could not be fetched: nothing submitted, no new snapshot"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # /anime/sitemap.xml is listed by the index only once the hub is open; a missing one is not an error.
          curl -fsS https://bunnyverse.org/anime/sitemap.xml -o anime.xml || : > anime.xml
          python3 - <<'PY'
          import re
          urls = []
          for name in ('hub.xml', 'anime.xml'):
              try:
                  text = open(name, encoding='utf-8').read()
              except OSError:
                  continue
              urls += re.findall(r'<url>.*?</url>', text, re.S)
          head = '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
          open('current/sitemap-hub-flat.xml', 'w', encoding='utf-8').write(head + '\n'.join(urls) + '\n</urlset>\n')
          print(len(urls), 'urls in the flattened sitemap')
          PY
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Fetch the snapshot of the last hub submission
        if: ${{ steps.fetch.outputs.ok == 'true' && github.event.inputs.hub_urls == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The newest unexpired artifact named sitemap-snapshot-hub, from whichever run produced it (a run whose kpopquiz.org job failed still counts, and so does a run
          # whose hub job failed after uploading).
          id=$(gh api "repos/${GH_REPO}/actions/artifacts?name=sitemap-snapshot-hub&per_page=1" --jq '.artifacts[0] | select(.expired == false) | .workflow_run.id // empty' || true)
          if [ -n "$id" ]; then gh run download "$id" --name sitemap-snapshot-hub --dir prev || echo "no hub snapshot in run $id"; fi
      - name: Submit the changed URLs to IndexNow
        if: ${{ steps.fetch.outputs.ok == 'true' && github.event.inputs.hub_urls == '' }}
        env:
          INDEXNOW_TOKEN: ${{ secrets.INDEXNOW_TOKEN }}
        run: |
          if [ -z "$INDEXNOW_TOKEN" ]; then
            echo "INDEXNOW_TOKEN secret not set - skipping"; exit 0
          fi
          # An HTTP error of the route is reported, not fatal: the live sitemap is still recorded below as the baseline.
          if [ -s prev/sitemap-hub-flat.xml ]; then
            curl -fsS -X POST -H 'content-type: application/xml' --data-binary @prev/sitemap-hub-flat.xml "https://bunnyverse.org/api/indexnow?token=${INDEXNOW_TOKEN}" \
              || echo "the hub route answered an error: recording the baseline anyway"
          else
            echo "no previous hub sitemap: recording the baseline, submitting nothing"
            curl -fsS -X POST --data-binary '' "https://bunnyverse.org/api/indexnow?token=${INDEXNOW_TOKEN}" || echo "the hub route answered an error: recording the baseline anyway"
          fi
      - name: Submit the listed URLs (hub_urls) once
        if: ${{ github.event.inputs.hub_urls != '' }}
        env:
          INDEXNOW_TOKEN: ${{ secrets.INDEXNOW_TOKEN }}
          HUB_URLS: ${{ github.event.inputs.hub_urls }}
        run: |
          if [ -z "$INDEXNOW_TOKEN" ]; then
            echo "INDEXNOW_TOKEN secret not set - skipping"; exit 0
          fi
          # Exactly the lines given, nothing else: the route (mode=urls) keeps the URLs of bunnyverse.org and answers how many it sent.
          printf '%s\n' "$HUB_URLS" | curl -fsS -X POST -H 'content-type: text/plain' --data-binary @- "https://bunnyverse.org/api/indexnow?token=${INDEXNOW_TOKEN}&mode=urls" \
            || echo "the hub route answered an error: nothing more is sent"
      - name: Keep this sitemap for the next run
        if: ${{ steps.fetch.outputs.ok == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-snapshot-hub
          path: current/sitemap-hub-flat.xml
          retention-days: 90
