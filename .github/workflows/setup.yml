name: Server Setup (idempotent)

# Run manually to apply config.js changes to the live Discord server.
# Safe to re-run: every create is guarded by check-if-exists.
on:
  workflow_dispatch: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'Kpop Quiz'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Apply server config
        run: npm run setup
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
