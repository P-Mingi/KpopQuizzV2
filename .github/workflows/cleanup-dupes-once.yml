name: Cleanup duplicate bare-name channels (one-off)

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'Kpop Quiz'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 'Kpop Quiz/package-lock.json'
      - run: npm ci
      - name: Delete bare-name dupes
        run: node src/cleanupDupes.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
      - name: Re-run setup (idempotent, now finds decorated names)
        run: npm run setup
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
